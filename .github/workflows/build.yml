name: Free My TV Android 11 - TCL G07

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK build tools
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Get original Free My TV source
        run: |
          git clone --depth 1 https://github.com/simbasjungles/free-my-tv.git free-my-tv
          git -C free-my-tv rev-parse HEAD

      - name: Adapt minimum SDK to Android 11 (experimental)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("free-my-tv/build.sh")
          text=p.read_text()
          for old,new in [("--min-sdk-version 31","--min-sdk-version 30"),("--min-api 31","--min-api 30")]:
              if old not in text:
                  raise SystemExit(f"Upstream build.sh changed, missing {old!r}")
              text=text.replace(old,new)
          p.write_text(text)
          cfg=Path("free-my-tv/config.example.properties")
          if cfg.exists():
              cfg.write_text(cfg.read_text().replace("tmdb_region=US","tmdb_region=MX"))
          PY

      - name: Allow private TMDB key configuration from atvTools
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          recs = Path("free-my-tv/app/src/io/freemytv/Recs.java")
          s = recs.read_text()
          def sub_one(old, new):
              global s
              if s.count(old) != 1:
                  raise SystemExit("Unexpected upstream Recs.java layout: " + old[:80])
              s = s.replace(old, new)
          sub_one(
              "    static boolean hasKey(Context c) {\n        return !Config.TMDB_KEY.trim().isEmpty();\n    }",
              """    /** User-supplied key stays in the TV's private app storage, not in the public APK. */
              private static String tmdbKey(Context c) {
                  String key = c.getSharedPreferences("tmdb_config", Context.MODE_PRIVATE).getString("key", "");
                  return key.trim().isEmpty() ? Config.TMDB_KEY.trim() : key.trim();
              }

              static boolean hasKey(Context c) {
                  return !tmdbKey(c).isEmpty();
              }""".replace("              ", "    ")
          )
          sub_one("long stamp = Config.TMDB_KEY.hashCode() * 31L + REGION.hashCode();",
                  "long stamp = tmdbKey(context).hashCode() * 31L + REGION.hashCode();")
          sub_one("String key = Config.TMDB_KEY.trim();", "String key = tmdbKey(context);")
          recs.write_text(s)

          activity = Path("free-my-tv/app/src/io/freemytv/SettingsActivity.java")
          s = activity.read_text()
          def change(old, new):
              global s
              if s.count(old) != 1:
                  raise SystemExit("Unexpected upstream SettingsActivity.java layout: " + old[:80])
              s = s.replace(old, new)
          change("        Ui.init(this);\n        view = new SettingsView(this);",
                 "        Ui.init(this);\n        saveTmdbKeyFromIntent(getIntent());\n        view = new SettingsView(this);")
          change("        setIntent(intent);\n    }\n\n    @Override protected void onPause()",
                 "        setIntent(intent);\n        saveTmdbKeyFromIntent(intent);\n    }\n\n    @Override protected void onPause()")
          anchor = "    @Override protected void onResume() {"
          method = """    /** ADB: am start -n io.freemytv/.SettingsActivity --es tmdb_api_key KEY
     *  Key is stored in app-private SharedPreferences, never uploaded to GitHub. */
    private void saveTmdbKeyFromIntent(Intent intent) {
        if (intent == null || !intent.hasExtra("tmdb_api_key")) return;
        String key = intent.getStringExtra("tmdb_api_key");
        intent.removeExtra("tmdb_api_key");
        if (key == null || !key.trim().matches("[A-Za-z0-9._-]{20,1024}")) {
            AppLog.w("TMDB key was rejected: invalid format");
            return;
        }
        getSharedPreferences("tmdb_config", MODE_PRIVATE).edit().putString("key", key.trim()).commit();
        AppLog.w("TMDB key saved locally");
        Recs.get(this).refreshIfStale();
    }

"""
          change(anchor, method + anchor)
          activity.write_text(s)
          PY

      - name: Build and sign FreeMyTV.apk
        working-directory: free-my-tv
        run: bash build.sh

      - name: Verify APK (Android 11, API 30)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp free-my-tv/FreeMyTV.apk release/FreeMyTV-Android11-TCL-G07-EXPERIMENTAL.apk
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/aapt" dump badging release/*.apk | tee release/apk-info.txt
          grep -q "sdkVersion:'30'" release/apk-info.txt
          "$BT/apksigner" verify --verbose release/*.apk
          unzip -t release/*.apk
          sha256sum release/*.apk > release/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-Android11-TCL-G07-EXPERIMENTAL
          path: release/
          retention-days: 30
          if-no-files-found: error
